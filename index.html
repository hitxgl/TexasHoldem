                        if (isWinner && p.handEval && p.handEval.best5) {
                            p.handEval.best5.forEach(c => winKeys.add(cardKey(c)));
                        }
                        // Keep hero hole cards face-up after fold; other players stay face-down until showdown.
                        const revealed = showCards && (p.isHuman || !p.folded);
                        const foldDim = (p.folded && !p.isHuman) ? 'opacity-50' : '';
                        cardsHTML = `<div class="flex gap-1 -mb-3 z-10 ${foldDim}">${p.cards.map(c =>
                            this.renderCardHTML(c, revealed, winKeys.has(cardKey(c)))
                        ).join('')}</div>`;
                    }

                    const badges = [];
                    if (i === this.dealerIdx)
                        badges.push('<span class="bg-amber-400 text-slate-950 text-[10px] px-1.5 h-5 rounded-full font-black flex items-center border border-white" title="庄家">庄</span>');
                    if (this.currentStage !== 'IDLE' && i === sbIdx)
                        badges.push('<span class="bg-blue-500 text-white text-[10px] px-1.5 h-5 rounded-full font-black flex items-center border border-white" title="小盲">小</span>');
                    if (this.currentStage !== 'IDLE' && i === bbIdx)
                        badges.push('<span class="bg-yellow-600 text-white text-[10px] px-1.5 h-5 rounded-full font-black flex items-center border border-white" title="大盲">大</span>');

                    const actionCls = (label) => {
                        if (!label) return 'bg-black text-amber-100 border-amber-300';
                        if (label.includes('弃牌')) return 'bg-red-600 text-white border-red-200';
                        if (label.includes('全押')) return 'bg-amber-300 text-black border-white';
                        if (label.includes('加注')) return 'bg-orange-500 text-white border-orange-100';
                        if (label.includes('跟注')) return 'bg-sky-500 text-white border-sky-100';
                        if (label.includes('看牌')) return 'bg-emerald-600 text-white border-emerald-200';
                        if (label.includes('小盲') || label.includes('大盲')) return 'bg-violet-600 text-white border-violet-200';
                        if (label.includes('出局')) return 'bg-zinc-900 text-zinc-300 border-zinc-500';
                        return 'bg-black text-amber-100 border-amber-300';
                    };

                    let actionTag = '';
                    if (p.busted && (this.currentStage === 'IDLE' || this.currentStage === 'SETTLED'))
                        actionTag = `<div class="seat-action-tag ${actionCls('出局')}">出局</div>`;
                    else if (p.lastAction)
                        actionTag = `<div class="seat-action-tag ${actionCls(p.lastAction)}" title="${p.lastAction}">${p.lastAction}</div>`;

                    let handTag = '';
                    if (showdown && !p.folded && !p.busted && p.handEval) {
                        const handLabel = formatHandLabel(p.handEval);
                        const winCls = isWinner ? ' winner' : '';
                        const prefix = isWinner ? '🏆 ' : '';
                        handTag = `<div class="seat-hand-tag${winCls}" title="${handLabel}">${prefix}${handLabel}</div>`;
                    }

                    const bbStack = this.bigBlind > 0 ? (p.chips / this.bigBlind).toFixed(1) : '0';
                    seatDiv.innerHTML = `
                        ${cardsHTML}
                        ${actionTag}
                        <div class="relative bg-slate-900/90 border ${isCurrent ? 'active-player-glow border-poker-gold' : 'border-slate-700'} ${isWinner ? 'ring-4 ring-poker-gold' : ''} px-3 py-2 rounded-2xl shadow-xl flex items-center gap-2.5 min-w-[120px] max-w-[150px] z-20">
                            ${badges.length ? `<div class="absolute -top-2.5 left-1/2 -translate-x-1/2 flex gap-0.5">${badges.join('')}</div>` : ''}
                            <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold ${p.isHuman ? 'text-poker-gold' : 'text-slate-300'}">
                                ${p.isHuman ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>'}
                            </div>
                            <div class="flex-1 overflow-hidden">
                                <div class="text-[11px] font-bold truncate text-slate-200">${p.name}</div>
                                <div class="text-xs font-bold text-poker-goldLight">$${p.chips} <span class="text-[10px] text-slate-500 font-normal">${bbStack}BB</span></div>
                            </div>
                        </div>
                        ${handTag}
                    `;
                    container.appendChild(seatDiv);

                    // Street bet chip in front of seat (toward table center)
                    if (p.currentBet > 0 && !p.busted) {
                        const betLeft = cx + rx * 0.58 * Math.cos(angle);
                        const betTop = cy + ry * 0.58 * Math.sin(angle);
                        const betDiv = document.createElement('div');
                        betDiv.className = 'street-bet absolute transform -translate-x-1/2 -translate-y-1/2';
                        betDiv.style.left = `${betLeft}%`;
                        betDiv.style.top = `${betTop}%`;
                        betDiv.innerHTML = `
                            <div class="street-bet-chip" title="本街下注 $${p.currentBet}"></div>
                            <div class="street-bet-amt">$${p.currentBet}</div>
                        `;
                        container.appendChild(betDiv);
                    }
                });
            }

            renderCardHTML(card, isRevealed, isWinningCard = false) {
                const sizeCls = 'w-11 h-16 md:w-14 md:h-[5.25rem]';
                if (!isRevealed) {
                    return `<div class="${sizeCls} bg-gradient-to-br from-blue-900 to-indigo-950 border-2 border-slate-300 rounded-lg shadow-md flex items-center justify-center p-1">
                        <i class="fa-solid fa-shield-halved text-blue-400/50 text-base md:text-lg"></i></div>`;
                }
                const label = RANK_LABEL[card.rank] || card.rank;
                const suit = SUIT_SYMBOLS[card.suit];
                return `<div class="poker-card poker-card-face ${isWinningCard ? 'card-winner-glow' : ''} ${sizeCls} bg-poker-cardBg border border-slate-300 rounded-lg shadow-md flex flex-col justify-between p-1 md:p-1.5 font-bold ${SUIT_COLORS[card.suit]}">
                    <div class="leading-none"><span class="card-rank">${label}</span><br><span class="card-suit-sm">${suit}</span></div>
                    <div class="text-center card-suit-lg">${suit}</div>
                    <div class="leading-none text-right rotate-180"><span class="card-rank">${label}</span></div>
                </div>`;
            }

            renderCommunityCards(winningPlayers = null) {
                const winners = winningPlayers || this.winners || [];
                const container = document.getElementById('community-cards-container');
                if (this.communityCards.length === 0) {
                    container.innerHTML = `<div class="text-slate-500/40 text-xs tracking-widest font-cinzel italic border border-dashed border-slate-600/40 px-8 py-8 rounded-xl">荷官发牌区</div>`;
                    return;
                }
                const winKeys = new Set();
                winners.forEach(w => {
                    if (w.handEval && w.handEval.best5) w.handEval.best5.forEach(c => winKeys.add(cardKey(c)));
                });
                let html = this.communityCards.map(c =>
                    this.renderCardHTML(c, true, winKeys.has(cardKey(c)))
                ).join('');
                if (this.resultText && (this.currentStage === 'SETTLED' || this.currentStage === 'SHOWDOWN')) {
                    html += `<div class="w-full basis-full text-center mt-2 text-xs font-semibold text-poker-goldLight">${this.resultText}</div>`;
                }
                container.innerHTML = html;
            }

            updateActionButtonLegality() {
                const hero = this.players[0];
                const raiseBtn = document.getElementById('btn-raise');
                const isHeroTurn = hero && this.players[this.currentTurnIdx] === hero
                    && !['IDLE', 'SETTLED', 'SHOWDOWN'].includes(this.currentStage)
                    && !hero.folded && !hero.isAllIn;
                if (!isHeroTurn) {
                    raiseBtn.classList.add('opacity-40', 'pointer-events-none');
                    raiseBtn.disabled = true;
                    return;
                }
                const toCall = Math.max(0, this.currentHighBet - hero.currentBet);
                const maxTo = hero.chips + hero.currentBet;
                const canRaise = hero.canRaise !== false && hero.chips > toCall && maxTo > this.currentHighBet;
                if (canRaise) {
                    raiseBtn.classList.remove('opacity-40', 'pointer-events-none');
                    raiseBtn.disabled = false;
                } else {
                    raiseBtn.classList.add('opacity-40', 'pointer-events-none');
                    raiseBtn.disabled = true;
                }
            }

            updateUI() {
                document.getElementById('total-pot-amount').textContent = `$${this.livePot()}`;
                let phase = this.currentStage === 'IDLE'
                    ? '欢迎光临 — 点击发牌开始'
                    : `阶段: ${STAGE_NAMES[this.currentStage] || this.currentStage}`;
                if (this.resultText && this.currentStage === 'SETTLED') phase = this.resultText;
                document.getElementById('game-phase-badge').textContent = phase;
                document.getElementById('header-blinds').textContent = `$${this.smallBlind} / $${this.bigBlind}`;
                const blindsHint = document.getElementById('header-blinds-hint');
                if (blindsHint) {
                    if (this.risingBlindsEnabled) {
                        blindsHint.classList.remove('hidden');
                        const left = this.handsUntilNextRise();
                        const next = this.previewNextBlinds();
                        blindsHint.textContent = (left === 0)
                            ? `下局 → $${next.sb}/$${next.bb}`
                            : `${left}手后 → $${next.sb}/$${next.bb}`;
                        blindsHint.title = this.risingIntervalMode === 'orbit'
                            ? `升盲：每满一圈庄（当前间隔 ${this.getRiseInterval()} 手）`
                            : `升盲：每 ${this.risingHandsInterval} 手`;
                    } else {
                        blindsHint.classList.add('hidden');
                        blindsHint.textContent = '';
                        blindsHint.title = '';
                    }
                }
                document.getElementById('header-ai').textContent = AI_LABELS[this.aiDifficulty];
                this.updateSpectateUI();
                const hero = this.players[0];
                if (hero) {
                    const callAmt = Math.max(0, this.currentHighBet - hero.currentBet);
                    const callPay = Math.min(hero.chips, callAmt);
                    document.getElementById('lbl-check-call').textContent = callAmt <= 0 ? '看牌' : (callPay >= hero.chips && callAmt > 0 ? '全押跟注' : '跟注');
                    document.getElementById('sub-check-call').textContent = callAmt <= 0 ? 'Check $0' : `Call $${callPay}`;
                    const slider = document.getElementById('raise-slider');
                    const minTo = this.minRaiseTo();
                    const maxAllowed = hero.chips + hero.currentBet;
                    let sliderMin = maxAllowed;
                    if (maxAllowed > this.currentHighBet) {
                        sliderMin = maxAllowed < minTo ? maxAllowed : Math.min(Math.max(minTo, hero.currentBet + 1), maxAllowed);
                    }
                    slider.min = sliderMin;
                    slider.max = Math.max(maxAllowed, sliderMin);
                    let val = parseInt(slider.value, 10);
                    if (!Number.isFinite(val)) val = sliderMin;
                    val = Math.max(parseInt(slider.min, 10), Math.min(parseInt(slider.max, 10), val));
                    slider.value = val;
                    document.getElementById('raise-amount-display').textContent = `$${slider.value}`;
                    const isAllIn = parseInt(slider.value, 10) >= maxAllowed;
                    document.getElementById('lbl-raise').textContent = isAllIn ? '全押' : '加注';
                    document.getElementById('sub-raise').textContent = `至 $${slider.value}`;
                }
                this.renderSeats();
                if (this.communityCards.length) this.renderCommunityCards();
                this.updateActionButtonLegality();
            }

            enableActionControls() {
                document.getElementById('action-controls').classList.remove('opacity-50', 'pointer-events-none');
                this.updateActionButtonLegality();
                PokerSFX.yourTurn();
            }
            disableActionControls() {
                document.getElementById('action-controls').classList.add('opacity-50', 'pointer-events-none');
            }

            log(msg) {
                const logBox = document.getElementById('game-log');
                const entry = document.createElement('div');
                entry.className = 'text-slate-300 my-0.5';
                const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                entry.innerHTML = `<span class="text-slate-500">[${t}]</span> ${msg}`;
                logBox.appendChild(entry);
                logBox.scrollTop = logBox.scrollHeight;
            }

            showGtoCoach() {
                const hero = this.players[0];
                if (!hero || this.currentStage === 'IDLE') {
                    document.getElementById('gto-coach-content').innerHTML =
                        '<p class="text-slate-400">请先开始一局牌，再查看 GTO 建议。</p>';
                    document.getElementById('gto-modal').classList.remove('hidden');
                    return;
                }
                if (hero.folded) {
                    document.getElementById('gto-coach-content').innerHTML =
                        '<p class="text-slate-400">您已弃牌，本街无行动建议。可等待摊牌或开启下一局。</p>';
                    document.getElementById('gto-modal').classList.remove('hidden');
                    return;
                }
                const gto = this.getGtoActionProbabilities(hero);
                const foldPct = (gto.fold * 100).toFixed(0);
                const callPct = (gto.call * 100).toFixed(0);
                const raisePct = (gto.raise * 100).toFixed(0);
                const advice = gto.toCall <= 0
                    ? (gto.raise > 0.4 ? '无人下注，手牌较强时可考虑价值加注或持续下注。' : '可便宜看牌，等待更好的机会。')
                    : (gto.strength > gto.potOdds
                        ? '手牌相对强度高于底池赔率，跟注或加注为正期望（+EV）。'
                        : '赔率偏紧，建议谨慎跟注或直接弃牌。');
                document.getElementById('gto-coach-content').innerHTML = `
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="bg-slate-800/80 rounded-lg p-3 border border-slate-700">
                            <div class="text-slate-400 text-xs mb-1">当前阶段</div>
                            <div class="font-bold text-poker-goldLight">${STAGE_NAMES[this.currentStage]}</div>
                        </div>
                        <div class="bg-slate-800/80 rounded-lg p-3 border border-slate-700">
                            <div class="text-slate-400 text-xs mb-1">需跟注</div>
                            <div class="font-bold text-sky-300">$${gto.toCall}</div>
                        </div>
                        <div class="bg-slate-800/80 rounded-lg p-3 border border-slate-700">
                            <div class="text-slate-400 text-xs mb-1">手牌相对强度</div>
                            <div class="font-bold text-emerald-400">${(gto.strength * 100).toFixed(1)}%</div>
                        </div>
                        <div class="bg-slate-800/80 rounded-lg p-3 border border-slate-700">
                            <div class="text-slate-400 text-xs mb-1">底池赔率</div>
                            <div class="font-bold text-amber-300">${(gto.potOdds * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="text-slate-300 font-semibold mb-2">GTO 推荐频率混合</div>
                        <div class="gto-bar">
                            <div class="gto-part" style="width:${foldPct}%;background:#dc2626">${foldPct > 8 ? '弃 ' + foldPct + '%' : ''}</div>
                            <div class="gto-part" style="width:${callPct}%;background:#2563eb">${callPct > 8 ? '跟 ' + callPct + '%' : ''}</div>
                            <div class="gto-part" style="width:${raisePct}%;background:#16a34a">${raisePct > 8 ? '加 ' + raisePct + '%' : ''}</div>
                        </div>
                        <div class="flex justify-between text-[10px] text-slate-500 mt-1 px-1">
                            <span>弃牌 ${foldPct}%</span><span>跟注 ${callPct}%</span><span>加注 ${raisePct}%</span>
                        </div>
                    </div>
                    <p class="mt-4 text-slate-400 text-sm leading-relaxed bg-slate-800/50 rounded-lg p-3 border border-slate-700/60">
                        <i class="fa-solid fa-lightbulb text-yellow-300 mr-1"></i>
                        <strong class="text-slate-200">分析建议：</strong>${advice}
                    </p>
                    <p class="mt-2 text-[11px] text-slate-500">说明：此为教学用启发式 GTO 近似，非完整求解器输出。当前最小加注额 $${this.minRaiseSize}（加注至至少 $${this.minRaiseTo()}）。</p>
                `;
                document.getElementById('gto-modal').classList.remove('hidden');
            }

            showReview() {
                if (!this.handHistory.length) {
                    document.getElementById('review-content').innerHTML =
                        '<p class="text-slate-400">本局尚无决策记录（可能未轮到您行动）。</p>';
                    document.getElementById('review-modal').classList.remove('hidden');
                    return;
                }
                const matched = this.handHistory.filter(h => h.match).length;
                const total = this.handHistory.length;
                const scorePct = Math.round((matched / total) * 100);
                let html = `
                    <div class="mb-4 bg-slate-800/80 rounded-lg p-3 border border-slate-700 flex items-center justify-between">
                        <span class="text-slate-300">GTO 吻合度</span>
                        <span class="font-bold text-lg ${scorePct >= 70 ? 'text-emerald-400' : scorePct >= 40 ? 'text-amber-300' : 'text-red-400'}">${matched}/${total}（${scorePct}%）</span>
                    </div>`;
                html += this.handHistory.map((h, i) => {
                    const actLabel = ACTION_CN[h.action] || h.action;
                    const recLabel = ACTION_CN[h.recommended] || h.recommended;
                    return `
                    <div class="border-b border-slate-800 py-3">
                        <div class="flex justify-between items-start gap-2">
                            <p class="font-semibold text-slate-200">#${i + 1} [${h.street}]</p>
                            <span class="text-xs px-2 py-0.5 rounded-full ${h.match ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-700/50' : 'bg-red-900/40 text-red-300 border border-red-700/40'}">
                                ${h.match ? '✔ 符合' : '⚠ 偏离'}
                            </span>
                        </div>
                        <p class="mt-1">你的选择：<span class="text-poker-gold font-bold">${actLabel}</span>
                           · GTO 主推：<span class="text-purple-300">${recLabel}</span></p>
                        <p class="text-xs text-slate-500 mt-1">
                            强度 ${(h.strength * 100).toFixed(0)}% · 赔率 ${(h.potOdds * 100).toFixed(0)}%
                            · 混合 弃${(h.mix.fold * 100).toFixed(0)}% / 跟${(h.mix.call * 100).toFixed(0)}% / 加${(h.mix.raise * 100).toFixed(0)}%
                        </p>
                    </div>`;
                }).join('');
                document.getElementById('review-content').innerHTML = html;
                document.getElementById('review-modal').classList.remove('hidden');
            }


            hideTournamentEndOverlay() {
                const el = document.getElementById('tournament-end-overlay');
                if (!el) return;
                el.classList.add('hidden');
                el.classList.remove('hero-win', 'ai-win');
                const box = document.getElementById('tournament-end-confetti');
                if (box) box.innerHTML = '';
            }

            showTournamentEndOverlay(champion) {
                const el = document.getElementById('tournament-end-overlay');
                if (!el) return;
                const heroWin = !!(champion && champion.isHuman);
                el.classList.remove('hidden', 'hero-win', 'ai-win');
                el.classList.add(heroWin ? 'hero-win' : 'ai-win');
                const title = document.getElementById('tournament-end-title');
                const sub = document.getElementById('tournament-end-sub');
                const icon = document.getElementById('tournament-end-icon');
                if (heroWin) {
                    title.textContent = '冠军！';
                    title.className = 'font-cinzel text-xl sm:text-2xl font-black text-poker-gold tracking-wide leading-tight';
                    sub.textContent = `恭喜！您淘汰了所有对手，筹码 $${champion.chips.toLocaleString()} 称霸全桌。`;
                    icon.innerHTML = '<i class="fa-solid fa-crown"></i>';
                    icon.className = 'end-crown text-3xl sm:text-4xl text-poker-gold shrink-0';
                    PokerSFX.win();
                    this.spawnConfetti();
                } else {
                    const name = champion ? champion.name : '无人';
                    title.textContent = '比赛结束';
                    title.className = 'font-cinzel text-xl sm:text-2xl font-black text-slate-200 tracking-wide leading-tight';
                    sub.textContent = champion
                        ? `本届冠军：${name}（$${champion.chips.toLocaleString()}）。再开一桌挑战吧！`
                        : '存活玩家不足，牌局已结束。';
                    icon.innerHTML = '<i class="fa-solid fa-flag-checkered"></i>';
                    icon.className = 'end-crown text-3xl sm:text-4xl text-slate-300 shrink-0';
                    const box = document.getElementById('tournament-end-confetti');
                    if (box) box.innerHTML = '';
                }
            }

            spawnConfetti() {
                const box = document.getElementById('tournament-end-confetti');
                if (!box) return;
                box.innerHTML = '';
                const colors = ['#d4af37', '#fbbf24', '#f87171', '#34d399', '#60a5fa', '#e879f9', '#fef3c7'];
                for (let i = 0; i < 22; i++) {
                    const p = document.createElement('span');
                    p.className = 'confetti-piece';
                    p.style.left = (Math.random() * 100) + '%';
                    p.style.background = colors[i % colors.length];
                    p.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
                    p.style.animationDelay = (Math.random() * 0.6) + 's';
                    p.style.width = (6 + Math.random() * 6) + 'px';
                    p.style.height = (8 + Math.random() * 8) + 'px';
                    p.style.opacity = String(0.75 + Math.random() * 0.25);
                    box.appendChild(p);
                }
            }

            /** Same as settings「保存并重新开始」: reset chips/seats with current config, no page refresh. */
            restartTournament() {
                PokerSFX.click();
                this._handSeq++;
                document.getElementById('lbl-start-btn').textContent = '开始发牌';
                document.getElementById('btn-start-deal').classList.remove('opacity-50', 'pointer-events-none');
                this.resetTable();
            }

            initUIEventListeners() {
                document.getElementById('btn-mute-sfx').addEventListener('click', () => {
                    PokerSFX.unlock();
                    PokerSFX.toggleMute();
                });
                document.getElementById('btn-open-settings').addEventListener('click', () => {
                    PokerSFX.click();
                    this.syncRisingOptionsUI();
                    document.getElementById('settings-modal').classList.remove('hidden');
                });
                document.getElementById('cfg-rising-enabled').addEventListener('change', () => this.syncRisingOptionsUI());
                document.getElementById('cfg-rising-interval-mode').addEventListener('change', () => this.syncRisingOptionsUI());
                document.getElementById('cfg-rising-increase-mode').addEventListener('change', () => this.syncRisingOptionsUI());
                document.getElementById('btn-close-settings').addEventListener('click', () => {
                    PokerSFX.click();
                    document.getElementById('settings-modal').classList.add('hidden');
                });
                document.getElementById('cfg-player-count').addEventListener('input', (e) => {
                    document.getElementById('cfg-player-count-val').textContent = e.target.value;
                });
                document.getElementById('btn-save-settings').addEventListener('click', () => {
                    PokerSFX.click();
                    this._handSeq++;
                    this.numPlayers = parseInt(document.getElementById('cfg-player-count').value, 10);
                    this.startingStack = parseInt(document.getElementById('cfg-start-stack').value, 10);
                    const blinds = document.getElementById('cfg-blinds').value.split('-').map(Number);
                    this.smallBlind = blinds[0];
                    this.bigBlind = blinds[1];
                    this.baseSmallBlind = blinds[0];
                    this.baseBigBlind = blinds[1];
                    this.aiDifficulty = document.getElementById('cfg-ai-difficulty').value;
                    this.risingBlindsEnabled = document.getElementById('cfg-rising-enabled').checked;
                    this.risingIntervalMode = document.getElementById('cfg-rising-interval-mode').value;
                    this.risingHandsInterval = Math.max(1, parseInt(document.getElementById('cfg-rising-hands').value, 10) || 6);
                    this.risingIncreaseMode = document.getElementById('cfg-rising-increase-mode').value;
                    this.risingStepAmount = this.baseBigBlind;
                    this.risingMult = parseFloat(document.getElementById('cfg-rising-mult').value) || 1.5;
                    this.handsAtLevel = 0;
                    document.getElementById('settings-modal').classList.add('hidden');
                    document.getElementById('lbl-start-btn').textContent = '开始发牌';
                    document.getElementById('btn-start-deal').classList.remove('opacity-50', 'pointer-events-none');
                    this.resetTable();
                });
                document.getElementById('btn-tournament-restart').addEventListener('click', () => {
                    this.restartTournament();
                });
                document.getElementById('btn-start-deal').addEventListener('click', () => {
                    if (this.currentStage !== 'IDLE' && this.currentStage !== 'SETTLED') return;
                    PokerSFX.click();
                    document.getElementById('btn-start-deal').classList.add('opacity-50', 'pointer-events-none');
                    this.startHand();
                });
                document.getElementById('btn-fold').addEventListener('click', () => {
                    if (this.players[this.currentTurnIdx] !== this.players[0]) return;
                    this.handlePlayerAction(this.players[0], 'FOLD');
                });
                document.getElementById('btn-check-call').addEventListener('click', () => {
                    const hero = this.players[0];
                    if (this.players[this.currentTurnIdx] !== hero) return;
                    const callAmt = this.currentHighBet - hero.currentBet;
                    this.handlePlayerAction(hero, callAmt <= 0 ? 'CHECK' : 'CALL', callAmt);
                });
                document.getElementById('btn-raise').addEventListener('click', () => {
                    if (this.players[this.currentTurnIdx] !== this.players[0]) return;
                    const raiseVal = parseInt(document.getElementById('raise-slider').value, 10);
                    this.handlePlayerAction(this.players[0], 'RAISE', raiseVal);
                });
                document.getElementById('raise-slider').addEventListener('input', (e) => {
                    document.getElementById('raise-amount-display').textContent = `$${e.target.value}`;
                    const hero = this.players[0];
                    const maxAllowed = hero ? hero.chips + hero.currentBet : 0;
                    const isAllIn = parseInt(e.target.value, 10) >= maxAllowed;
                    document.getElementById('lbl-raise').textContent = isAllIn ? '全押' : '加注';
                    document.getElementById('sub-raise').textContent = `至 $${e.target.value}`;
                });
                document.querySelectorAll('.btn-bet-preset').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        PokerSFX.click();
                        const factor = e.currentTarget.getAttribute('data-factor');
                        const hero = this.players[0];
                        if (!hero) return;
                        const slider = document.getElementById('raise-slider');
                        const toCall = Math.max(0, this.currentHighBet - hero.currentBet);
                        // 2x/3x = multiples of the facing bet; if nobody has bet this street
                        // (currentHighBet === 0), fall back to BB so presets are not stuck at the blind/min.
                        const betBasis = this.currentHighBet > 0 ? this.currentHighBet : this.bigBlind;
                        let val = this.minRaiseTo();
                        if (factor === 'min') val = this.minRaiseTo();
                        else if (factor === '2x') val = Math.max(betBasis * 2, this.minRaiseTo());
                        else if (factor === '3x') val = Math.max(betBasis * 3, this.minRaiseTo());
                        else if (factor === 'pot') val = this.currentHighBet + this.livePot() + toCall;
                        else if (factor === 'allin') val = hero.chips + hero.currentBet;
                        const max = hero.chips + hero.currentBet;
                        const min = parseInt(slider.min, 10) || 0;
                        const clamped = Math.min(max, Math.max(min, Math.floor(val)));
                        slider.value = String(clamped);
                        document.getElementById('raise-amount-display').textContent = `$${slider.value}`;
                        document.getElementById('lbl-raise').textContent = parseInt(slider.value, 10) >= max ? '全押' : '加注';
                        document.getElementById('sub-raise').textContent = `至 $${slider.value}`;
                    });
                });
                document.getElementById('btn-gto-coach').addEventListener('click', () => { PokerSFX.click(); this.showGtoCoach(); });
                document.getElementById('btn-close-gto').addEventListener('click', () => {
                    PokerSFX.click();
                    document.getElementById('gto-modal').classList.add('hidden');
                });
                document.getElementById('btn-review').addEventListener('click', () => { PokerSFX.click(); this.showReview(); });
                document.getElementById('btn-close-review').addEventListener('click', () => {
                    PokerSFX.click();
                    document.getElementById('review-modal').classList.add('hidden');
                });
                ['settings-modal', 'gto-modal', 'review-modal'].forEach(id => {
                    document.getElementById(id).addEventListener('click', (e) => {
                        if (e.target.id === id) e.currentTarget.classList.add('hidden');
                    });
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.gameInstance = new TexasHoldemGame();
            window.gameInstance.resetTable();
        });
    </script>
</body>
